<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Location</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #0f766e;
            --primary-strong: #115e59;
            --border: #d1d5db;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .toolbar {
            background: var(--surface);
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 16px;
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .toolbar h3 {
            margin: 0;
            margin-right: auto;
            font-size: 1rem;
        }

        button {
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            padding: 10px 12px;
            cursor: pointer;
        }

        button:hover {
            background: var(--primary-strong);
        }

        #locateBtn {
            background: #374151;
        }

        #locateBtn:hover {
            background: #1f2937;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .footer {
            background: var(--surface);
            border-top: 1px solid #e5e7eb;
            padding: 10px 16px;
            color: var(--muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<div class="toolbar">
    <h3>Select your location</h3>
    <button id="locateBtn" type="button">Use My Current Location</button>
    <button id="confirmBtn" type="button">Confirm Location</button>
</div>

<div id="map"></div>
<div id="status" class="footer">Tip: click anywhere on the map to move the marker.</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
let map;
let marker;
const statusEl = document.getElementById("status");

function setStatus(text) {
    statusEl.textContent = text;
}

function setMarker(lat, lon, message) {
    if (!marker) {
        marker = L.marker([lat, lon], { draggable: true }).addTo(map);
        marker.on("dragend", () => {
            const pos = marker.getLatLng();
            setStatus("Selected coordinates: " + pos.lat.toFixed(6) + ", " + pos.lng.toFixed(6));
        });
    } else {
        marker.setLatLng([lat, lon]);
    }

    if (message) {
        marker.bindPopup(message).openPopup();
    }
    setStatus("Selected coordinates: " + lat.toFixed(6) + ", " + lon.toFixed(6));
}

function confirmLocation() {
    if (!marker) {
        setStatus("Please pick a location first.");
        return;
    }

    const pos = marker.getLatLng();
    if (!window.opener) {
        setStatus("Parent window not found. Close and retry.");
        return;
    }

    window.opener.postMessage(
        {
            lat: pos.lat,
            lon: pos.lng
        },
        window.location.origin
    );

    window.close();
}

function initMap(lat, lon) {
    map = L.map("map").setView([lat, lon], 15);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    setMarker(lat, lon, "Drag or click to refine your location.");

    map.on("click", (event) => {
        const clicked = event.latlng;
        setMarker(clicked.lat, clicked.lng);
    });
}

function useCurrentLocation() {
    if (!navigator.geolocation) {
        setStatus("Geolocation not supported in this browser.");
        return;
    }

    setStatus("Fetching your current location...");
    navigator.geolocation.getCurrentPosition(
        (position) => {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            map.setView([lat, lon], 16);
            setMarker(lat, lon, "Current location detected.");
        },
        () => {
            setStatus("Could not access location. Choose manually on map.");
        },
        { enableHighAccuracy: true, timeout: 10000 }
    );
}

document.getElementById("locateBtn").addEventListener("click", useCurrentLocation);
document.getElementById("confirmBtn").addEventListener("click", confirmLocation);

navigator.geolocation.getCurrentPosition(
    (position) => {
        initMap(position.coords.latitude, position.coords.longitude);
    },
    () => {
        initMap(12.9716, 77.5946);
        setStatus("Using default map center. Select your location.");
    },
    { enableHighAccuracy: true, timeout: 10000 }
);
</script>
</body>
</html>
